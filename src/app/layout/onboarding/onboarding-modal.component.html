<!-- Modal de Onboarding ("Configuración inicial del espacio de trabajo") -->
<div 
  class="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto bg-black/60 backdrop-blur-xs animate-in fade-in duration-200"
  (click)="handleBackdropClick($event)">
  
  <div 
    class="relative w-full max-w-lg my-auto bg-white dark:bg-[#19181E] border border-[#EAE2DE] dark:border-[#2A2832] rounded-3xl p-6 sm:p-7 shadow-2xl space-y-6 select-none animate-in zoom-in-95 duration-200"
    (click)="$event.stopPropagation()">
    
    <!-- Encabezado con Saludo Personalizado -->
    <div class="flex items-start justify-between gap-3 pb-3 border-b border-[#EAE2DE] dark:border-[#2A2832]">
      <div class="flex items-center gap-3.5 min-w-0">
        <app-brand-logo variant="icon" class="shrink-0 w-11 h-11"></app-brand-logo>
        <div class="space-y-1 min-w-0">
          <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#FAF7F5] dark:bg-[#121115] border border-[#EAE2DE] dark:border-[#2A2832] text-[10px] font-semibold text-[#74566E] dark:text-[#9D7B96]">
            <lucide-icon [img]="SparklesIcon" [size]="12" [strokeWidth]="2"></lucide-icon>
            <span>Primeros pasos</span>
          </div>
          <h2 class="text-lg sm:text-xl font-bold text-[#231F20] dark:text-[#F3EFEA] tracking-tight leading-snug">
            Bienvenido, {{ userFirstName }}
          </h2>
          <p class="text-xs text-[#635B5E] dark:text-neutral-400 leading-relaxed">
            Personaliza tu espacio de trabajo en segundos. Podrás cambiar esto después en Ajustes.
          </p>
        </div>
      </div>

      <!-- Botón de salida rápida / cancelar (Escape) -->
      <button
        type="button"
        (click)="dismissWithoutCompleting()"
        [disabled]="isSubmitting()"
        class="p-1.5 rounded-xl text-[#635B5E] hover:text-[#231F20] dark:hover:text-white hover:bg-[#FAF7F5] dark:hover:bg-[#201E27] transition-colors cursor-pointer shrink-0"
        title="Cerrar sin guardar (Escape)">
        <lucide-icon [img]="XIcon" [size]="16" [strokeWidth]="2"></lucide-icon>
      </button>
    </div>

    <!-- 1. Apariencia (Tarjetas visuales: Claro, Oscuro, Sistema) -->
    <div class="space-y-2.5">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-[#231F20] dark:text-[#F3EFEA] flex items-center gap-1.5">
          <lucide-icon [img]="SunIcon" [size]="14" [strokeWidth]="2" class="text-[#74566E] dark:text-[#9D7B96]"></lucide-icon>
          <span>Apariencia</span>
        </label>
        <span class="text-[11px] text-[#635B5E] dark:text-neutral-400 font-mono">
          Vista previa en vivo
        </span>
      </div>

      <div class="grid grid-cols-3 gap-2.5">
        @for (opt of themeOptions; track opt.id) {
          <button
            type="button"
            (click)="onSelectTheme(opt.id)"
            [disabled]="isSubmitting()"
            class="group relative flex flex-col items-center justify-center p-3.5 rounded-2xl border text-center transition-all cursor-pointer text-xs"
            [ngClass]="selectedTheme() === opt.id
              ? 'border-[#74566E] dark:border-[#9D7B96] bg-[#FAF7F5] dark:bg-[#201E27] shadow-sm ring-2 ring-[#74566E]/20 dark:ring-[#9D7B96]/30'
              : 'border-[#EAE2DE] dark:border-[#2A2832] bg-white dark:bg-[#16151B] hover:border-[#74566E]/40 hover:bg-[#FAF7F5]/50 dark:hover:bg-[#1E1C24]'">
            
            <!-- Checkmark activo -->
            @if (selectedTheme() === opt.id) {
              <div class="absolute top-2 right-2 w-4 h-4 rounded-full bg-[#74566E] dark:bg-[#9D7B96] text-white flex items-center justify-center shadow-2xs">
                <lucide-icon [img]="CheckIcon" [size]="10" [strokeWidth]="3"></lucide-icon>
              </div>
            }

            <div class="w-9 h-9 rounded-xl flex items-center justify-center mb-2 transition-transform group-hover:scale-105"
              [ngClass]="selectedTheme() === opt.id
                ? 'bg-[#EFEAF6] text-[#74566E] dark:bg-[#74566E]/20 dark:text-[#9D7B96]'
                : 'bg-[#FAF7F5] dark:bg-[#19181E] text-[#635B5E] dark:text-neutral-400'">
              <lucide-icon [img]="opt.icon" [size]="18" [strokeWidth]="2"></lucide-icon>
            </div>

            <div class="font-bold text-xs text-[#231F20] dark:text-[#F3EFEA]">
              {{ opt.label }}
            </div>
            <div class="text-[10px] text-[#635B5E] dark:text-neutral-400 mt-0.5 line-clamp-1">
              {{ opt.description }}
            </div>
          </button>
        }
      </div>
    </div>

    <!-- 2. Color de acento (5 Muestras circulares basadas en tokens) -->
    <div class="space-y-2.5">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-[#231F20] dark:text-[#F3EFEA] flex items-center gap-1.5">
          <lucide-icon [img]="PaletteIcon" [size]="14" [strokeWidth]="2" class="text-[#74566E] dark:text-[#9D7B96]"></lucide-icon>
          <span>Color de acento</span>
        </label>
        <span class="text-[11px] text-[#635B5E] dark:text-neutral-400">
          Paleta editorial
        </span>
      </div>

      <div class="grid grid-cols-5 gap-2">
        @for (swatch of accentChoices; track swatch.id) {
          <button
            type="button"
            (click)="onSelectAccent(swatch.id)"
            [disabled]="isSubmitting()"
            class="flex flex-col items-center gap-1.5 p-2 rounded-2xl border transition-all cursor-pointer group"
            [ngClass]="selectedAccent() === swatch.id
              ? 'border-[#74566E]/40 dark:border-[#9D7B96]/40 bg-[#FAF7F5] dark:bg-[#201E27]'
              : 'border-transparent hover:bg-[#FAF7F5] dark:hover:bg-[#1E1C24]'">
            
            <!-- Círculo de color con anillo activo y check -->
            <div 
              class="relative w-8 h-8 rounded-full flex items-center justify-center transition-transform group-hover:scale-110 shadow-xs"
              [style.backgroundColor]="swatch.color"
              [ngClass]="selectedAccent() === swatch.id
                ? 'ring-3 ring-offset-2 ring-[#74566E] dark:ring-[#9D7B96] dark:ring-offset-[#19181E]'
                : ''">
              @if (selectedAccent() === swatch.id) {
                <lucide-icon [img]="CheckIcon" [size]="13" [strokeWidth]="3" class="text-white drop-shadow-xs"></lucide-icon>
              }
            </div>

            <!-- Etiqueta del acento -->
            <span class="text-[11px] font-semibold text-[#231F20] dark:text-[#F3EFEA] text-center leading-none">
              {{ swatch.label }}
            </span>

            @if (swatch.isDefault) {
              <span class="text-[9px] px-1 py-0.2 rounded bg-[#FAF7F5] dark:bg-[#121115] text-[#74566E] dark:text-[#9D7B96] font-bold uppercase tracking-wider">
                Defecto
              </span>
            }
          </button>
        }
      </div>
    </div>

    <!-- 3. Datos de ejemplo (Checkbox desmarcado por defecto) -->
    <div class="p-3.5 rounded-2xl bg-[#FAF7F5] dark:bg-[#121115] border border-[#EAE2DE] dark:border-[#2A2832]">
      <label class="flex items-start gap-3 cursor-pointer select-none">
        <input
          type="checkbox"
          [checked]="loadSampleData()"
          (change)="loadSampleData.set($any($event.target).checked)"
          [disabled]="isSubmitting()"
          class="w-4 h-4 mt-0.5 rounded border-[#EAE2DE] text-[#74566E] focus:ring-[#74566E] cursor-pointer shrink-0 accent-[#74566E]"
        />
        <div class="min-w-0 flex-1 space-y-0.5">
          <div class="text-xs font-bold text-[#231F20] dark:text-[#F3EFEA] flex items-center gap-1.5">
            <lucide-icon [img]="LayersIcon" [size]="13" [strokeWidth]="2" class="text-[#74566E] dark:text-[#9D7B96]"></lucide-icon>
            <span>Cargar datos de ejemplo para explorar la app</span>
          </div>
          <p class="text-[11px] text-[#635B5E] dark:text-neutral-400 leading-snug">
            Incluye un evento, una tarea y un recordatorio de prueba. Si lo dejas desmarcado, empezarás totalmente en blanco.
          </p>
        </div>
      </label>
    </div>

    <!-- Pie del Modal: Acciones -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2 border-t border-[#EAE2DE] dark:border-[#2A2832]">
      <button
        type="button"
        (click)="useDefaultConfig()"
        [disabled]="isSubmitting()"
        class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-semibold text-[#635B5E] dark:text-neutral-400 hover:text-[#231F20] dark:hover:text-white hover:bg-[#FAF7F5] dark:hover:bg-[#201E27] transition-colors cursor-pointer text-center disabled:opacity-50">
        Usar configuración por defecto
      </button>

      <button
        type="button"
        (click)="confirmAndStart()"
        [disabled]="isSubmitting()"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold text-white transition-all shadow-sm cursor-pointer disabled:opacity-50"
        [style.backgroundColor]="'var(--app-accent, #74566E)'">
        @if (isSubmitting()) {
          <span class="w-3.5 h-3.5 rounded-full border-2 border-white/30 border-t-white animate-spin"></span>
          <span>Guardando preferencias...</span>
        } @else {
          <span>Comenzar</span>
          <lucide-icon [img]="ArrowRightIcon" [size]="14" [strokeWidth]="2"></lucide-icon>
        }
      </button>
    </div>

  </div>
</div>
