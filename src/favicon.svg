<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .brand-bg {
      fill: #FAF7F5;
      stroke: #EAE2DE;
    }
    .brand-pillar {
      fill: #74566E;
    }
    .brand-coral {
      fill: #C97D60;
    }
    .brand-tinted {
      fill: #74566E;
      fill-opacity: 0.28;
    }
    @media (prefers-color-scheme: dark) {
      .brand-bg {
        fill: #201E27;
        stroke: #2A2832;
      }
      .brand-pillar {
        fill: #9D7B96;
      }
      .brand-coral {
        fill: #D98D70;
      }
      .brand-tinted {
        fill: #9D7B96;
        fill-opacity: 0.35;
      }
    }
  </style>
  <!-- Contenedor / Ventana Bento -->
  <rect class="brand-bg" x="1" y="1" width="46" height="46" rx="13" stroke-width="1.5"/>
  <!-- Pilar Izquierdo (Enfoque Editorial) -->
  <rect class="brand-pillar" x="10" y="10" width="12" height="28" rx="4"/>
  <!-- Bloque Superior Derecho (Coral Terracota) -->
  <rect class="brand-coral" x="25" y="10" width="13" height="12" rx="4"/>
  <!-- Bloque Inferior Derecho (Acento Bento Suave) -->
  <rect class="brand-tinted" x="25" y="25" width="13" height="13" rx="4"/>
</svg>
